[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "datacache"
requires-python = ">=3.11"
authors = [{name="Alex Rubinsteyn", email="alex.rubinsteyn@unc.edu"}]
description = "Helpers for transparently downloading datasets"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
# Compatibility alias: tqdm is now installed with the base package.
progress = []
html = ["lxml>=4.9"]
test = ["pytest>=7", "pytest-cov>=7", "ruff", "lxml>=4.9"]

[project.scripts]
datacache = "datacache.cli:run"

[tool.setuptools.dynamic]
version = {attr = "datacache.version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["datacache"]

[project.urls]
"Homepage" = "https://github.com/openvax/datacache"
"Bug Tracker" = "https://github.com/openvax/datacache/issues"
"Documentation" = "https://github.com/openvax/datacache#readme"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "F841", "E731", "E741", "E722", "E721"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test*/*" = ["F401"]
