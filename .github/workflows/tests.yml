# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        dependencies: [current]
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            dependencies: minimum
          - os: ubuntu-latest
            python-version: "3.9"
            dependencies: legacy
          - os: macos-latest
            python-version: "3.12"
            dependencies: current

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Install older supported pandas and tqdm
        if: matrix.dependencies == 'minimum'
        run: python -m pip install "pandas==1.5.3" "numpy<2" "tqdm==4.64.0"
      - name: Check pre-1.5 pandas compatibility
        if: matrix.dependencies == 'legacy'
        run: python -m pip install "pandas==1.4.4" "numpy<2" "tqdm==4.64.0"
      - name: Lint with ruff
        run: |
          ./lint.sh
      - name: Run unit tests
        run: |
          ./test.sh
      - name: Run offline public API example
        run: python -m examples.basic_usage
      - name: Publish coverage to Coveralls
        # Coverage upload is best-effort: parallel matrix jobs race to post to
        # the same Coveralls build, and the loser gets a "build already closed"
        # error. Don't let that flake fail the whole test run.
        continue-on-error: true
        uses: coverallsapp/github-action@v2.2.3
